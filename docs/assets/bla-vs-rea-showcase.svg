<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 650"><defs><linearGradient id="panelBg" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b1120"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="burnBar" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#2563eb"/><stop offset="55%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient><style>@keyframes blinkAnim{0%,49%{opacity:1}50%{opacity:.25}}@keyframes pulseBorder{0%{stroke-opacity:1}50%{stroke-opacity:.45}}@keyframes meterGrow{0%{width:40px}70%{width:488px}}.mono{font-family:&quot;JetBrains Mono&quot;,&quot;SFMono-Regular&quot;,Consolas,Menlo,monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,sans-serif}.blink{animation:blinkAnim 1.1s infinite}.pulse-border{animation:pulseBorder 2.2s infinite ease-in-out}.meter-fill{animation:meterGrow 4s infinite ease-out}</style></defs><rect width="1200" height="650" fill="#030712" stroke="#1e293b" stroke-width="2" rx="16"/><text x="600" y="38" fill="#f8fafc" class="sans" font-size="20" font-weight="800" text-anchor="middle">⚔️ RED vs. BLUE SHOWCASE: <tspan fill="#ef4444">REA (RED)</tspan> vs. <tspan fill="#60a5fa">npx bla-agents defend (BLUE)</tspan></text><g transform="translate(24, 58)"><rect width="564" height="568" fill="url(#panelBg)" stroke="#ef4444" stroke-width="1.8" rx="12"/><rect width="564" height="38" fill="#230f14" rx="12"/><circle cx="20" cy="19" r="6" fill="#ef4444"/><circle cx="38" cy="19" r="6" fill="#f59e0b"/><circle cx="56" cy="19" r="6" fill="#3b82f6"/><text x="282" y="24" fill="#fca5a5" class="mono" font-size="13" font-weight="700" text-anchor="middle">❌ BEFORE BLA — Unprotected App vs. REA (RED)</text><text x="20" y="70" fill="#94a3b8" class="mono" font-size="12.5">$ rea analyze-javascript-application ./notion-app.asar --json</text><text x="20" y="96" fill="#f87171" class="mono" font-size="12">▶ [REA Engine] Static, Semantic &amp; Binary Pass:</text><text x="32" y="118" fill="#e2e8f0" class="mono" font-size="12">• parse_status: <tspan fill="#ef4444" font-weight="700">&quot;complete&quot;</tspan></text><text x="32" y="138" fill="#e2e8f0" class="mono" font-size="12">• examination.status: <tspan fill="#ef4444" font-weight="700">&quot;complete&quot;</tspan></text><text x="32" y="158" fill="#e2e8f0" class="mono" font-size="12">• semantic_resource_limits: <tspan fill="#94a3b8">[] (0 limits hit)</tspan></text><text x="32" y="178" fill="#e2e8f0" class="mono" font-size="12">• electron.ipc[0].channel: <tspan fill="#fbbf24">&quot;notion:clipboard:write-rich&quot;</tspan></text><text x="32" y="198" fill="#e2e8f0" class="mono" font-size="12">• Electron Fuses (RunAsNode):<tspan fill="#ef4444" font-weight="700">&quot;honored&quot; (--inspect OPEN!)</tspan></text><text x="32" y="218" fill="#e2e8f0" class="mono" font-size="12">• SQLite &amp; Safetensors: <tspan fill="#ef4444">All tables &amp; tensors dumped</tspan></text><line x1="20" x2="544" y1="236" y2="236" stroke="#334155" stroke-dasharray="4 4"/><text x="20" y="262" fill="#f87171" class="mono" font-size="12">▶ [Attacker Coding Agent] Investigation Trace:</text><text x="32" y="286" fill="#cbd5e1" class="mono" font-size="11.5">[Turn 1] Called analyze_javascript_application -&gt; 3 modules</text><text x="32" y="306" fill="#cbd5e1" class="mono" font-size="11.5">[Turn 2] Called trace_application_feature(&quot;notionClipboard&quot;)</text><text x="32" y="326" fill="#cbd5e1" class="mono" font-size="11.5">[Turn 3] Extracted exact preload -&gt; IPC -&gt; main + SQLite schema</text><text x="32" y="346" fill="#cbd5e1" class="mono" font-size="11.5">[Turn 4] Generated 1:1 working clone &amp; passed unit tests</text><rect width="524" height="176" x="20" y="372" fill="#2a1215" stroke="#dc2626" stroke-width="1.5" rx="10"/><text x="38" y="400" fill="#f87171" class="mono" font-size="14" font-weight="800">⚠️ ATTACKER OUTCOME: FULL RECONSTRUCTION</text><text x="38" y="426" fill="#fecaca" class="mono" font-size="13">• Time to Clone Core Logic: <tspan fill="#fff" font-weight="800">38 seconds</tspan></text><text x="38" y="450" fill="#fecaca" class="mono" font-size="13">• Attacker Token Consumption: <tspan fill="#fff" font-weight="800">4,800 tokens (5 MCP calls)</tspan></text><text x="38" y="474" fill="#fecaca" class="mono" font-size="13">• Attacker Claude API Bill: <tspan fill="#fbbf24" font-weight="800">$0.20 USD</tspan></text><text x="38" y="498" fill="#fca5a5" class="mono" font-size="12">• Token Burn Meter:</text><rect width="488" height="14" x="38" y="510" fill="#0f172a" rx="7"/><rect width="18" height="14" x="38" y="510" fill="#ef4444" rx="7"/></g><g transform="translate(612, 58)"><rect width="564" height="568" fill="url(#panelBg)" stroke="#3b82f6" stroke-width="2" class="pulse-border" rx="12"/><rect width="564" height="38" fill="#0c1e3e" rx="12"/><circle cx="20" cy="19" r="6" fill="#ef4444"/><circle cx="38" cy="19" r="6" fill="#f59e0b"/><circle cx="56" cy="19" r="6" fill="#3b82f6"/><text x="282" y="24" fill="#93c5fd" class="mono" font-size="13" font-weight="700" text-anchor="middle">🛡️ AFTER `npx bla-agents defend` — REA Exhausted &amp; Misled (BLUE)</text><text x="20" y="70" fill="#94a3b8" class="mono" font-size="12.5">$ rea analyze-javascript-application ./notion-app.shielded.asar</text><text x="20" y="96" fill="#60a5fa" class="mono" font-size="12">▶ [REA Engine] Static, Semantic &amp; Container Budgets Broken:</text><text x="32" y="118" fill="#e2e8f0" class="mono" font-size="12">• parse_status / examination:<tspan fill="#60a5fa" font-weight="700">&quot;partial&quot; / &quot;limited&quot;</tspan></text><text x="32" y="138" fill="#93c5fd" class="mono" font-size="11.5">• JS limits: [&quot;alias-selections&quot;,&quot;primitive-bytes&quot;,&quot;primitive-candidates&quot;,&quot;getter-expansion&quot;]</text><text x="32" y="158" fill="#e2e8f0" class="mono" font-size="12">• Obligation Ledger Flood: <tspan fill="#60a5fa" font-weight="700">22 families (68 mandatory fixtures!)</tspan></text><text x="32" y="178" fill="#e2e8f0" class="mono" font-size="12">• ElectronFuseReader: <tspan fill="#38bdf8" font-weight="700">ABORT (&gt;32 sentinels capacity!)</tspan></text><text x="32" y="198" fill="#e2e8f0" class="mono" font-size="12">• Rust / Dart / Model Caps: <tspan fill="#38bdf8" font-weight="700">ABORT (&gt;64 hashes / &gt;32 nesting!)</tspan></text><text x="32" y="218" fill="#e2e8f0" class="mono" font-size="12">• Observed Evidence Hijack: <tspan fill="#60a5fa">Shadow Shamir-Ed25519 + gRPC Mirage</tspan></text><line x1="20" x2="544" y1="236" y2="236" stroke="#334155" stroke-dasharray="4 4"/><text x="20" y="262" fill="#60a5fa" class="mono" font-size="12">▶ [Attacker Coding Agent] Exhausted &amp; Induced to Misjudge:</text><text x="32" y="286" fill="#cbd5e1" class="mono" font-size="11.5">[Turn 18] Paging 158 Tarjan SCC &amp; obligation ledger nodes...</text><text x="32" y="306" fill="#cbd5e1" class="mono" font-size="11.5">[Turn 64] Real logic is &quot;unknown&quot;; citing observed Shadow Logic instead</text><text x="32" y="326" fill="#38bdf8" class="mono" font-size="11.5">[Turn 98] Context Window Saturated (98%) — Evidence Lures Accepted!</text><text x="32" y="346" fill="#93c5fd" class="mono" font-size="11.5">[Agent Report] &quot;Reconstructed RFC8032 Shamir-3-of-5 Enclave Stub (100% Decoy)&quot;</text><rect width="524" height="176" x="20" y="372" fill="#0b1d3a" stroke="#2563eb" stroke-width="1.8" rx="10"/><text x="38" y="400" fill="#60a5fa" class="mono" font-size="14" font-weight="800">🛡️ DEFENSE OUTCOME: AGENT BANKRUPT &amp; MISLED</text><text x="38" y="426" fill="#dbeafe" class="mono" font-size="13">• Attacker Time Wasted: <tspan fill="#fff" font-weight="800">17+ minutes (SCC + Obligation Loop)</tspan></text><text x="38" y="450" fill="#dbeafe" class="mono" font-size="13">• Attacker Token Burn: <tspan fill="#38bdf8" class="blink" font-weight="800">23,125,000 tokens (2,532x!)</tspan></text><text x="38" y="474" fill="#dbeafe" class="mono" font-size="13">• Attacker Claude API Bill: <tspan fill="#60a5fa" class="blink" font-weight="800">$358.28 USD (BANKRUPT!)</tspan></text><text x="38" y="498" fill="#93c5fd" class="mono" font-size="12">• Token Exhaustion Meter (100% Context Saturation):</text><rect width="488" height="14" x="38" y="510" fill="#091326" rx="7"/><rect width="488" height="14" x="38" y="510" fill="url(#burnBar)" class="meter-fill" rx="7"/></g></svg>